<!DOCTYPE html>
<html>
<head>
    <title>ZOF Web Solver</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="p-4">

<h2 class="text-center mb-4">Zero of Functions (ZOF) Web Solver</h2>

<form action="/solve" method="post" class="card p-4 shadow">

    <!-- Polynomial Degree -->
    <label>Polynomial Degree:</label>
    <input type="number" name="degree" min="1" max="6" class="form-control mb-3" required>

    <div id="coeff-container" class="mb-3"></div>

    <label>Constant Term:</label>
    <input type="number" name="const" step="0.01" class="form-control mb-3" required>

    <label>Select Method:</label>
    <select name="method" class="form-control mb-3" required id="method-select">
        <option value="bisection">Bisection</option>
        <option value="regula">Regula Falsi</option>
        <option value="secant">Secant</option>
        <option value="newton">Newton–Raphson</option>
        <option value="modified">Modified Secant</option>
    </select>

    <!-- Method Inputs -->
    <div id="method-inputs"></div>

    <label>Tolerance:</label>
    <input type="number" step="0.000001" name="tol" class="form-control mb-3" required>

    <label>Max Iterations:</label>
    <input type="number" name="iter" class="form-control mb-3" required>

    <button class="btn btn-primary">Solve</button>
</form>

<script>
document.querySelector("input[name='degree']").addEventListener("change", function() {
    let deg = this.value;
    let box = document.getElementById("coeff-container");
    box.innerHTML = "";

    for (let i = 0; i < deg; i++) {
        box.innerHTML += `
            <label>Coefficient of x^${deg - i}:</label>
            <input type="number" step="0.01" name="c${i}" class="form-control mb-2" required>
        `;
    }
});

document.querySelector("select[name='method']").addEventListener("change", function() {
    let m = this.value;
    let box = document.getElementById("method-inputs");
    box.innerHTML = "";

    if (m === "bisection" || m === "regula") {
        box.innerHTML = `
            <label>a:</label><input type="number" name="a" step="0.01" class="form-control mb-2" required>
            <label>b:</label><input type="number" name="b" step="0.01" class="form-control mb-2" required>
        `;
    }
    else if (m === "secant") {
        box.innerHTML = `
            <label>x0:</label><input type="number" name="x0" step="0.01" class="form-control mb-2" required>
            <label>x1:</label><input type="number" name="x1" step="0.01" class="form-control mb-2" required>
        `;
    }
    else if (m === "newton") {
        box.innerHTML = `
            <label>Initial Guess x0:</label>
            <input type="number" name="x0" step="0.01" class="form-control mb-2" required>
        `;
    }
    else if (m === "modified") {
        box.innerHTML = `
            <label>x0:</label><input type="number" name="x0" step="0.01" class="form-control mb-2" required>
            <label>delta:</label><input type="number" name="delta" step="0.001" class="form-control mb-2" required>
        `;
    }
});
</script>

</body>
</html>
